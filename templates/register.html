<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina final IUJO</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles-register.css">
</head>
<body>
    
    <section>

        <div class="register-complete">
            <form>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="registerEmail" placeholder="name@example.com">
                    <label for="registerEmail">Correo electrónico</label>
                  </div>
                  <div class="form-floating">
                    <input type="password" class="form-control" id="registerPassword" placeholder="Password">
                    <label for="registerPassword">Contraseña</label>
                  </div>
                <button id="save" class="btn btn-primary mt-3">Registrarse</button>
              </form>
        </div>
    </section>

    <script src="/js/register.js"></script>
    <!-- <script src="/bootstrap/js/bootstrap.min.js"></script> -->

</body>
</html>
