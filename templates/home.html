<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles-home.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.1/css/all.css">
    <title>Document</title>
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../js/home.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-book" style="color: #fff;"></i>
            <h2>My Library Online</h2>
        </div>
        <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              Opciones
            </button>
            <ul class="dropdown-menu">
              <strong id="mensaje">Hola de nuevo</strong>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" id="close" onclick="confirmLogout(event)">Cerrar sesión</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center">Nuestros Libros</h1>
        <div class="row">
            <div class="col-md-4">
                <div class="card mb-4">
                    <img src="ruta/a/la/imagen1.jpg" class="card-img-top" alt="Libro 1">
                    <div class="card-body">
                        <h5 class="card-title">Título del Libro 1</h5>
                        <p class="card-text">Descripción breve del libro 1.</p>
                        <a href="#" class="btn btn-primary">Leer más</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card mb-4">
                    <img src="ruta/a/la/imagen2.jpg" class="card-img-top" alt="Libro 2">
                    <div class="card-body">
                        <h5 class="card-title">Título del Libro 2</h5>
                        <p class="card-text">Descripción breve del libro 2.</p>
                        <a href="#" class="btn btn-primary">Leer más</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card mb-4">
                    <img src="ruta/a/la/imagen3.jpg" class="card-img-top" alt="Libro 3">
                    <div class="card-body">
                        <h5 class="card-title">Título del Libro 3</h5>
                        <p class="card-text">Descripción breve del libro 3.</p>
                        <a href="#" class="btn btn-primary">Leer más</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
