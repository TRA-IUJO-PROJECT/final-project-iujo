<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles-home.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.1/css/all.css">
    <title>Document</title>
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../js/home.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo d-flex align-items-center">
            <i class="fas fa-book" style="color: #fff;"></i>
            <h2>My Library Online</h2>
        </div>
        <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              Opciones
            </button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" id="close" onclick="confirmLogout(event)">Cerrar sesión</a></li>
            </ul>
        </div>
    </nav>

    <h1 id="mensaje" class="text-dark text-start"></h1>

    <h1 class="text-center">Publica tus libros</h1>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="inputLibro">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="nameBook" placeholder="Harry Potter">
                        <label for="nameBook">Nombre del libro</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="authorBook" placeholder="Juan Ortiz">
                        <label for="authorBook">Autor del libro</label>
                    </div>
                    <div class="form-floating">
                        <textarea class="form-control" placeholder="Deja un comentario aquí" id="descriptionBook" style="height: 100px"></textarea>
                        <label for="descriptionBook">Agrega una descripción</label>
                    </div>
                    <br>
                    <div class="attach mb-3">
                        <label for="pdfInput" class="btn btn-primary" style="width: 460px;">Cargar libro</label>
                        <input type="file" id="pdfInput" accept="application/pdf" style="display: none;" onchange="namePdf()">
                        <span id="fileName" class="ms-2">No hay pdf elegido</span>
                    </div>
                    <br>
                    <div class="attach mb-3">
                        <label for="imgInput" class="btn btn-primary" style="width: 500px;">Cargar imagen</label>
                        <input type="file" id="imgInput" style="display: none;" onchange="nameImg()">
                        <span id="imgName" class="ms-2">No hay imagen elegida</span>
                    </div>
                    <br>
                    <button type="button" class="btn btn-success" onclick="cargarLibros()">Publicar libro</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <div class="row" id="contenedorLibro"></div>
    </div>

</body>
</html>
